[workspace]
authors = ["clash-native <329424465+clash-native@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "clash-native"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
format = "python scripts/format.py"
format-check = "python scripts/format.py --check"

[dependencies]
clang-format = ">=22,<23"
cmake = ">=3.24,<5"
ninja = ">=1.12,<2"
lldb = ">=22.1.8,<23"

# Linux-only: zig-cc toolchain (pixi-pinned) plus autotools/archive helpers
# that the Debian WSL image lacks (no sudo for apt, no curl/unzip/autoconf).
# C++ uses `zig c++`'s bundled libc++ (LLVM's, linked static); no
# /usr/include headers are mixed in with `-target x86_64-linux-gnu.2.17`.
[target.linux-64.dependencies]
zig = ">=0.16.0,<0.17"
# Full LLVM toolchain (ASan/debug lane): clang + libstdcxx-devel + sysroot;
# zig is NOT used here. Keep the zig portable-release lane and this lane
# separate, never mix their headers. NOTE: pixi `openssl` is intentionally
# absent: its headers collide with BoringSSL (`openssl/base.h` typedef
# redefinitions) since conda clang.cfg injects `-isystem <CFGDIR>/../include`.
clang = ">=23.1.2,<24"
clangxx = ">=23.1.2,<24"
lld = ">=23.1.2,<24"
compiler-rt = ">=23.1.2,<24"
llvm = ">=23.1.2,<24"
# boringssl (overlay port) needs nasm + go on Linux; the Windows lane gets
# them from the vcpkg-managed toolchain instead. NOTE: no `curl` here:
# conda curl pulls OpenSSL headers into <env>/include, colliding with
# BoringSSL via clang.cfg's `-isystem <env>/include` injection.
nasm = "*"
go = "*"
unzip = "*"
zip = "*"
autoconf = "*"
automake = "*"
libtool = "*"
pkg-config = "*"
